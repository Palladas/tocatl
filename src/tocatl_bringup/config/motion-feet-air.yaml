# Level 3 feet-in-air motion. Load AFTER homing-hip-knee.yaml in the same controller:
#   --params-file homing-hip-knee.yaml --params-file motion-feet-air.yaml
#   -p allow_homing:=true -p allow_hardware_motion:=true
#   -p actuation_motor_ids:=[...] -p telemetry_motor_ids:=[...] -p homing.legs:=[...]
# (the operator dashboard builds exactly this command for the selected legs).
# Robot supported, legs clear. Only hip pitch and knee move; yaw stays unpowered.
# Commands are accepted only for legs homed in this controller session.
#
# Gains/torque authorized by Pranav 2026-10-26 for this profile only: kp <= 30, kd <= 2,
# with every drive capped at 1.5 Nm (written and read back before enable, restored
# after confirmed disable). Speed raised to 5 rad/s and the target-to-measured step to
# 0.5 rad by Pranav 2026-10-27. Feedforward torque is unchanged.
motor_controller:
  ros__parameters:
    allow_hardware_motion: false
    command_timeout_s: 1.0
    command_max_age_s: 0.5
    max_motor_velocity_rad_s: 5.0
    max_motor_torque_nm: 0.5
    max_motor_kp: 30.0
    max_motor_kd: 2.0
    max_position_step_rad: 0.5
    motion_torque_limit_nm: 1.5
    poll_period_s: 0.1
    # Raw-encoder bounds relative to each motor's homed (compressed-stop) position this
    # session; away from the stop is raw-positive. Hip: up to 1.6 rad off the stop (the
    # 2026-08-25 calibration allowed 3.05). Knee: the calibration's [-0.1, 2.0], widened
    # below by 1.6 because the knee encoder follows the hip (coupling +1).
    # tocatl_kinematics checks the tighter joint limits before anything is sent.
    hip_pitch_home_offset_rad: [-0.02, 1.6]
    knee_home_offset_rad: [-1.7, 2.0]
