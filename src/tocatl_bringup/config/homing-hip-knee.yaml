# All six hip-pitch/knee pairs. Yaw motors are not homed (see motors/declare_yaw_reference).
# /motors/home runs the tripods (1,3,5) then (2,4,6); motors/tripod_135/home and
# motors/tripod_246/home run one tripod; motors/leg_N/home runs one leg.
#
# Stop references: powered homing on 2026-11-07 (run cli-20261107T121119Z, Level 2, one leg at a
# time, normal mode, one contact per motor; Pranav confirmed each leg ended at its real stop).
# These are the first references taken after the 2.7:1 hip-pitch gearbox (2026-11-05).
# - Raw encoder radians; the check is turn-aware (0.8107 rad turns across power cycles).
# - Previous references (direct-drive hips, 2026-10-25 unloaded declarations; leg 1 2026-10-25
#   commissioning) are in git history.
# - Stop force: the seek and contact torques are motor-side, so the hip stop is pushed ~2.7x
#   harder at the joint than before the gearbox.
motor_controller:
  ros__parameters:
    backend: hardware
    allow_hardware_motion: false
    allow_homing: false
    can_buses: [can0, can1, can2]
    can0_channel: can0
    can1_channel: can1
    can2_channel: can2
    telemetry_motor_ids: [12, 13, 22, 23, 32, 33, 42, 43, 52, 53, 62, 63]
    actuation_motor_ids: [12, 13, 22, 23, 32, 33, 42, 43, 52, 53, 62, 63]
    poll_period_s: 0.5
    telemetry_timeout_s: 1.5
    homing.method: hip_knee
    homing.legs: [1, 2, 3, 4, 5, 6]
    homing.verify_repeatability: false
    homing.output_path: /home/tocatl/tocatl/config/hip-knee-homing.json
    homing.leg_1.hip_stop_rad: 0.6601434348058302
    homing.leg_1.knee_stop_rad: 0.977912565804532
    homing.leg_1.hip_direction: -1
    homing.leg_1.knee_direction: -1
    homing.leg_2.hip_stop_rad: -1.2670710307469282
    homing.leg_2.knee_stop_rad: -1.2350270847638658
    homing.leg_2.hip_direction: -1
    homing.leg_2.knee_direction: -1
    homing.leg_3.hip_stop_rad: -1.4375906004425119
    homing.leg_3.knee_stop_rad: -0.711261158159763
    homing.leg_3.hip_direction: -1
    homing.leg_3.knee_direction: -1
    homing.leg_4.hip_stop_rad: -9.204051270313572
    homing.leg_4.knee_stop_rad: 0.25921263447012954
    homing.leg_4.hip_direction: -1
    homing.leg_4.knee_direction: -1
    homing.leg_5.hip_stop_rad: -8.01117723353933
    homing.leg_5.knee_stop_rad: -0.2798123140306714
    homing.leg_5.hip_direction: -1
    homing.leg_5.knee_direction: -1
    homing.leg_6.hip_stop_rad: -0.9252689402609295
    homing.leg_6.knee_stop_rad: -0.45567254139009705
    homing.leg_6.hip_direction: -1
    homing.leg_6.knee_direction: -1
