# All six hip-pitch/knee pairs. Yaw motors are not homed (see motors/declare_yaw_reference).
# /motors/home runs the tripods (1,3,5) then (2,4,6); motors/tripod_135/home and
# motors/tripod_246/home run one tripod; motors/leg_N/home runs one leg.
#
# Stop references: powered homing on 2026-11-07, run cli-20261107T125235Z (normal mode, one
# contact per motor, homing.enforce_hip_window:=false to re-learn). Legs 1/3/5 homed as a tripod,
# legs 2, 4 and 6 one at a time (leg 2's knee times out in the 2/4/6 tripod; unresolved). Second
# post-gearbox set; the first (run cli-20261107T121119Z) is in git history.
# Leg 2 hip 22 has scattered +/-0.05 rad between runs today (-1.267..-1.320, now -1.2327 twice);
# other hips repeat within ~0.02. Check leg 2's hip for backlash/compliance.
# - Raw encoder radians; the check is turn-aware (0.8107 rad turns across power cycles).
# - Previous references (direct-drive hips, 2026-10-25 unloaded declarations; leg 1 2026-10-25
#   commissioning) are in git history.
# - Stop force: the seek and contact torques are motor-side, so the hip stop is pushed ~2.7x
#   harder at the joint than before the gearbox.
motor_controller:
  ros__parameters:
    backend: hardware
    allow_hardware_motion: false
    allow_homing: false
    can_buses: [can0, can1, can2]
    can0_channel: can0
    can1_channel: can1
    can2_channel: can2
    telemetry_motor_ids: [12, 13, 22, 23, 32, 33, 42, 43, 52, 53, 62, 63]
    actuation_motor_ids: [12, 13, 22, 23, 32, 33, 42, 43, 52, 53, 62, 63]
    poll_period_s: 0.5
    telemetry_timeout_s: 1.5
    homing.method: hip_knee
    homing.legs: [1, 2, 3, 4, 5, 6]
    homing.verify_repeatability: false
    homing.output_path: /home/tocatl/tocatl/config/hip-knee-homing.json
    # Hip stage drive torque and contact threshold, motor side (Nm). Lower-only (<= 1.5).
    # Through the 2.7:1 gearbox, 1.5 Nm presses the hip stop with ~3.6 Nm at the joint;
    # ~0.6 Nm matches the old direct-drive joint force. Pick from data: each hip result
    # records peak_seek_effort_nm (free travel). Keep the contact effort well above it, and
    # the limit ~0.3-0.5 Nm above the contact effort. Knee stage stays 1.5 / 1.0.
    homing.hip_torque_limit_nm: 1.5
    homing.hip_contact_effort_nm: 1.0
    # Hip contacts must land inside the turn-aware 0.03 rad window of hip_stop_rad, or the leg
    # refuses. Pass -p homing.enforce_hip_window:=false only to re-learn references (results
    # still record reference_within_window); keep it true otherwise.
    homing.enforce_hip_window: true
    homing.leg_1.hip_stop_rad: 0.6513694972152297
    homing.leg_1.knee_stop_rad: 0.9737163347829405
    homing.leg_1.hip_direction: -1
    homing.leg_1.knee_direction: -1
    homing.leg_2.hip_stop_rad: -1.2327382314793613
    homing.leg_2.knee_stop_rad: -1.267833981841763
    homing.leg_2.hip_direction: -1
    homing.leg_2.knee_direction: -1
    homing.leg_3.hip_stop_rad: -1.4559014267185475
    homing.leg_3.knee_stop_rad: -0.7055390249485018
    homing.leg_3.hip_direction: -1
    homing.leg_3.knee_direction: -1
    homing.leg_4.hip_stop_rad: -9.206721599145494
    homing.leg_4.knee_stop_rad: 0.2523460746166162
    homing.leg_4.hip_direction: -1
    homing.leg_4.knee_direction: -1
    homing.leg_5.hip_stop_rad: -8.011940184634165
    homing.leg_5.knee_stop_rad: -0.28095674067292364
    homing.leg_5.hip_direction: -1
    homing.leg_5.knee_direction: -1
    homing.leg_6.hip_stop_rad: -0.9393835355153737
    homing.leg_6.knee_stop_rad: -0.45529106584267964
    homing.leg_6.hip_direction: -1
    homing.leg_6.knee_direction: -1
