motor_controller:
  ros__parameters:
    backend: hardware
    # Leg 5 yaw (51) back in service 2026-10-27 (Pranav): reconnected 2026-10-26 and passed
    # read-only polling incl. the production transport (docs/motor51-diagnosis-2026-10-26.md).
    # The 2026-10-25 can1 TX stall was not reproduced or explained: if can1 stalls again,
    # stop the controller, reset can1, and follow that document's swap test.
    telemetry_motor_ids: [11, 12, 13, 21, 22, 23, 31, 32, 33, 41, 42, 43, 51, 52, 53, 61, 62, 63]
    actuation_motor_ids: [11, 12, 13, 21, 22, 23, 31, 32, 33, 41, 42, 43, 51, 52, 53, 61, 62, 63]
    can0_channel: can0
    can1_channel: can1
    poll_period_s: 0.5
    telemetry_timeout_s: 1.5
    body_frame: base_link
    # Motion requires explicit opt-in AND measured motor-space envelopes.
    allow_hardware_motion: false
    command_timeout_s: 1.0
    command_max_age_s: 0.5
    max_motor_velocity_rad_s: 0.21
    max_motor_torque_nm: 0.5
    max_motor_kp: 5.0
    max_motor_kd: 1.0
    max_position_step_rad: 0.1
    # motor_min_position_rad / motor_max_position_rad: measured raw encoder
    # limits in actuation_motor_ids order above; full canonical 18-entry arrays
    # are also accepted. Unset = no arming.
