# Supervised hip commissioning template, intentionally NOT executable as supplied.
# Choose a tested torque cap; validate the raw envelope for the current session.
# Use instead of hardware.yaml, with exactly one CAN command owner.
motor_controller:
  ros__parameters:
    backend: hardware
    allow_hardware_motion: false
    allow_homing: false
    can0_channel: can0
    can1_channel: can1
    poll_period_s: 0.5
    telemetry_timeout_s: 1.5
    homing.motor_id: 32
    homing.direction: -1
    homing.torque_limit_nm: 0.0  # REQUIRED: no assumed safe torque for printed stops
    homing.min_position_rad: -0.78
    homing.max_position_rad: -0.15
    homing.expected_stop_rad: -0.7330
    homing.speed_rad_s: 0.03
    homing.phase_timeout_s: 20.0
    homing.output_path: leg3-homing.json
    # For motor 33, also configure homing.knee_hip_reference_rad with a measured,
    # repeatable hip pose. Remeasure the knee stop at that exact hip pose.
